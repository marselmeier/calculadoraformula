<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Pigmentos — Bases Naturais</title>
<style>
  :root{
    --ink:#141414;
    --paper:#ffffff;
    --line:#d9d9d9;
    --grey-mid:#8a8a8a;
    --grey-soft:#f2f2f2;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
  }
  body{
    font-family: 'Georgia', 'Iowan Old Style', serif;
    background: linear-gradient(160deg, #fbe3e8 0%, #e3f2ea 35%, #ece2f6 65%, #fbecc9 100%);
    color: var(--ink);
    position: relative;
    overflow-x: hidden;
  }

  /* ---- Blobs orgânicos pastel de fundo ---- */
  .blob{
    position: fixed;
    border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%;
    filter: blur(38px);
    opacity: 0.55;
    z-index: 0;
    pointer-events: none;
  }
  .blob1{
    width: 320px; height: 280px;
    top: -80px; left: -60px;
    background: #f7d8de; /* rosa pastel */
  }
  .blob2{
    width: 280px; height: 300px;
    top: 30px; right: -100px;
    background: #d6ece4; /* menta pastel */
    border-radius: 40% 60% 65% 35% / 55% 45% 55% 45%;
  }
  .blob3{
    width: 240px; height: 200px;
    bottom: 260px; left: -80px;
    background: #e6ddf2; /* lavanda pastel */
    border-radius: 55% 45% 40% 60% / 45% 55% 45% 55%;
  }
  .blob4{
    width: 200px; height: 200px;
    bottom: -60px; right: -60px;
    background: #fbeccb; /* amarelo pastel */
  }

  .top-banner{
    position: relative;
    z-index: 1;
    width: 100%;
    height: auto;
    overflow: visible;
    background: transparent;
    margin-bottom: -34px;
  }
  .top-banner img{
    width: 100%;
    height: auto;
    display: block;
    filter: saturate(1.05);
  }
  .top-banner::after{
    content:"";
    position:absolute;
    left:0; right:0; top:100%;
    height: 90px;
    background: transparent;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    pointer-events:none;
  }

  .wrap{
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin: 0 auto;
    padding: 64px 16px 48px;
  }
  .eyebrow{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--grey-mid);
    font-weight: 600;
    margin-bottom: 6px;
  }
  h1{
    font-size: 25px;
    line-height: 1.15;
    margin: 0 0 4px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .sub{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    color: #5c5c5c;
    margin-bottom: 24px;
  }
  .card{
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 20px;
    margin-bottom: 18px;
  }
  label{
    display:block;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .row{
    display:flex;
    gap: 12px;
    margin-bottom: 16px;
  }
  .field{flex:1;}
  input[type=number]{
    width: 100%;
    padding: 10px 12px;
    font-size: 16px;
    border: 1.5px solid var(--line);
    border-radius: 4px;
    background: var(--grey-soft);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  input[type=number]:focus{
    outline: none;
    border-color: var(--ink);
    background: #fff;
  }
  button{
    width: 100%;
    padding: 13px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    background: var(--ink);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  button:hover{ background: #fff; color: var(--ink); }
  button:focus-visible{ outline: 2px solid var(--ink); outline-offset: 2px; }

  #result{ display:none; }
  .result-title{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--grey-mid);
    font-weight: 700;
    margin-bottom: 10px;
  }
  .grams-row{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .grams-label{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    color: var(--ink);
  }
  .grams-value{
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
  }
  .mix-bar{
    height: 50px;
    border-radius: 3px;
    overflow: hidden;
    display:flex;
    margin: 14px 0 6px;
    border: 1.5px solid var(--ink);
  }
  .mix-seg{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 10.5px;
    line-height: 1.2;
    font-weight: 700;
    transition: width 0.4s ease;
    white-space: normal;
    text-align: center;
    overflow: hidden;
    padding: 2px 4px;
  }
  .pct-caption{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12px;
    color: var(--grey-mid);
    text-align: center;
    margin-bottom: 4px;
  }
  .warn{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: var(--grey-soft);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 12px 14px;
    display:none;
  }
  details{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    color: #5c5c5c;
    margin-top: 4px;
  }
  summary{
    cursor:pointer;
    font-weight:700;
    color: var(--ink);
    margin-bottom: 8px;
  }
  code{
    background: var(--grey-soft);
    padding:1px 5px;
    border-radius:3px;
    font-size:12px;
    border: 1px solid var(--line);
  }
  footer{
    text-align:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 11px;
    color: var(--grey-mid);
    margin-top: 28px;
    letter-spacing: 0.06em;
  }
</style>
</head>

<div class="wrap">
  <h1>Calculadora de Proporção de Pigmentos</h1>
  <div class="sub">Descubra exatamente quanto usar de cada tinta natural para chegar na base desejada.</div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label for="baseA">Tinta A (base)</label>
        <input type="number" id="baseA" min="1" max="10" step="1" placeholder="ex: 6">
      </div>
      <div class="field">
        <label for="baseB">Tinta B (base)</label>
        <input type="number" id="baseB" min="1" max="10" step="1" placeholder="ex: 4">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="baseD">Base desejada</label>
        <input type="number" id="baseD" min="1" max="10" step="1" placeholder="ex: 5">
      </div>
      <div class="field">
        <label for="massa">Massa total (g)</label>
        <input type="number" id="massa" min="1" step="1" placeholder="ex: 60">
      </div>
    </div>
    <button onclick="calcular()">Calcular proporção</button>
  </div>

  <div class="warn" id="warn"></div>

  <div class="card" id="result">
    <div class="result-title">Resultado</div>

    <div class="grams-row">
      <span class="grams-label" id="labelA">Tinta A</span>
      <span class="grams-value" id="valA">0g</span>
    </div>
    <div class="grams-row">
      <span class="grams-label" id="labelB">Tinta B</span>
      <span class="grams-value" id="valB">0g</span>
    </div>

    <div class="mix-bar" id="mixBar">
      <div class="mix-seg" id="segA"></div>
      <div class="mix-seg" id="segB"></div>
    </div>
    <div class="pct-caption" id="pctCaption"></div>
    <div class="pct-caption" id="adjustNote"></div>
  </div>

  <footer>by Marsel Meier · @marselmeier</footer>
</div>

<script>
function P(n){ return Math.pow(2, 11-n); }

function baseName(n){
  const names = {
    1:'Preto', 2:'Castanho/Preto', 3:'Castanho escuro', 4:'Castanho médio',
    5:'Castanho claro', 6:'Louro escuro', 7:'Louro médio', 8:'Louro claro',
    9:'Louro muito claro', 10:'Louro claríssimo'
  };
  return names[Math.round(n)] || `Base ${n}`;
}

function baseGrey(n){
  // Escala de cinza: base 1 (mais escura) -> base 10 (mais clara)
  n = Math.max(1, Math.min(10, n));
  const t = (n-1)/9; // 0 a 1
  const v = Math.round(30 + t*(235-30));
  return `rgb(${v},${v},${v})`;
}
function textOn(v){
  // decide cor do texto (branco ou preto) conforme o tom de cinza de fundo
  return v < 130 ? '#fff' : '#141414';
}

function gcd(a,b){ a=Math.round(a); b=Math.round(b); while(b){ [a,b]=[b, a%b]; } return a || 1; }

function calcular(){
  const A = parseFloat(document.getElementById('baseA').value);
  const B = parseFloat(document.getElementById('baseB').value);
  const D = parseFloat(document.getElementById('baseD').value);
  const M = parseFloat(document.getElementById('massa').value);

  const warnEl = document.getElementById('warn');
  const resultEl = document.getElementById('result');

  if(!A || !B || !D || !M || A<1 || A>10 || B<1 || B>10 || D<1 || D>10){
    warnEl.style.display = 'block';
    warnEl.textContent = 'Preencha todos os campos com bases entre 1 e 10 e uma massa maior que zero.';
    resultEl.style.display = 'none';
    return;
  }
  if(A === B){
    warnEl.style.display = 'block';
    warnEl.textContent = 'Tinta A e Tinta B não podem ser a mesma base.';
    resultEl.style.display = 'none';
    return;
  }
  const min = Math.min(A,B), max = Math.max(A,B);
  if(D < min || D > max){
    warnEl.style.display = 'block';
    warnEl.textContent = `A base ${D} está fora do intervalo entre ${A} e ${B}. Não é possível chegar nela misturando só essas duas tintas — escolha uma terceira tinta mais próxima.`;
    resultEl.style.display = 'none';
    return;
  }
  warnEl.style.display = 'none';

  const PA = P(A), PB = P(B), PD = P(D);
  const diffB = Math.abs(PB - PD);
  const diffA = Math.abs(PD - PA);

  // Proporção simplificada em números inteiros (partes de A : partes de B)
  let partsA, partsB;
  if(diffA === 0 && diffB === 0){
    partsA = 1; partsB = 1;
  } else if(diffA === 0){
    partsA = 1; partsB = 0;
  } else if(diffB === 0){
    partsA = 0; partsB = 1;
  } else {
    const g = gcd(diffB, diffA);
    partsA = diffB / g;
    partsB = diffA / g;
  }
  const sumParts = partsA + partsB;

  // Ajusta a massa total para o múltiplo mais próximo que resulta em gramas redondas
  let roundedM = Math.round(M / sumParts) * sumParts;
  if(roundedM <= 0) roundedM = sumParts;

  const massA = roundedM * (partsA / sumParts);
  const massB = roundedM - massA;
  const pctA = (massA/roundedM*100);
  const pctB = 100 - pctA;

  document.getElementById('labelA').textContent = `Tinta base ${A}`;
  document.getElementById('labelB').textContent = `Tinta base ${B}`;
  document.getElementById('valA').textContent = massA.toFixed(0) + 'g';
  document.getElementById('valB').textContent = massB.toFixed(0) + 'g';

  const segA = document.getElementById('segA');
  const segB = document.getElementById('segB');
  segA.style.width = pctA + '%';
  segB.style.width = pctB + '%';

  const grayValA = 30 + ((A-1)/9)*(235-30);
  const grayValB = 30 + ((B-1)/9)*(235-30);
  segA.style.background = baseGrey(A);
  segB.style.background = baseGrey(B);
  segA.style.color = textOn(grayValA);
  segB.style.color = textOn(grayValB);
  segA.textContent = pctA >= 10 ? `${A} · ${pctA.toFixed(0)}%` : '';
  segB.textContent = pctB >= 10 ? `${B} · ${pctB.toFixed(0)}%` : '';

  document.getElementById('pctCaption').textContent = `Base ${A} → Base ${D} (alvo) → Base ${B} · proporção ${partsA}:${partsB}`;

  const adjustNote = document.getElementById('adjustNote');
  if(roundedM !== M){
    adjustNote.textContent = `Massa ajustada de ${M}g para ${roundedM}g para fechar em números redondos.`;
  } else {
    adjustNote.textContent = '';
  }

  resultEl.style.display = 'block';
}
</script>
</body>
</html>
